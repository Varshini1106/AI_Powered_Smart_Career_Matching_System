<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications | CareerMatcher AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --bg: #f8fafc;
            --sidebar: #0f172a;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --white: #ffffff;
            --card-border: #f1f5f9;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; min-height: 100vh; }

        /* Sidebar Navigation */
        nav { width: 280px; background: var(--sidebar); color: white; padding: 40px 24px; position: fixed; height: 100vh; z-index: 100; }
        .logo { font-size: 1.5rem; font-weight: 800; margin-bottom: 48px; display: flex; align-items: center; gap: 12px; }
        .logo i { color: var(--primary); }
        .nav-links { list-style: none; }
        .nav-links a { color: #94a3b8; text-decoration: none; display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 12px; transition: 0.3s; margin-bottom: 8px; font-weight: 500; }
        .nav-links a:hover { color: white; background: rgba(255,255,255,0.05); }
        .nav-links a.active { background: var(--primary); color: white; }

        /* Main Content */
        main { flex-grow: 1; margin-left: 280px; padding: 60px 80px; max-width: 1200px; }
        header { margin-bottom: 40px; }
        
        /* Application Cards */
        .app-grid { display: flex; flex-direction: column; gap: 20px; }
        .app-card { background: var(--white); padding: 28px; border-radius: 24px; border: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .app-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); }

        .job-title { font-size: 1.25rem; font-weight: 700; color: var(--sidebar); margin-bottom: 8px; }
        .action-btns { display: flex; gap: 10px; align-items: center; }
        
        .btn { padding: 10px 18px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; font-size: 0.85rem; }
        .btn-info { background: #f1f5f9; color: var(--primary); }
        .btn-delete { background: #fee2e2; color: var(--danger); }
        .btn:hover { opacity: 0.8; }

        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 24px; width: 550px; max-width: 90%; position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-header { margin-bottom: 20px; }
        .close-modal { position: absolute; right: 25px; top: 25px; cursor: pointer; font-size: 1.5rem; color: var(--text-muted); }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85rem; color: var(--text-muted); }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 0.95rem; }
        
        .save-btn { width: 100%; background: var(--primary); color: white; padding: 14px; border-radius: 12px; border: none; font-weight: 700; margin-top: 10px; cursor: pointer; }

        .status-badge { padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .status-pending { background: #fffbeb; color: #b45309; }
    </style>
</head>
<body>
    <nav>
        <div class="logo"><i class="fas fa-bolt"></i> <span>CareerMatcher</span></div>
        <ul class="nav-links">
            <li><a href="user-dashboard.html"><i class="fas fa-home"></i> <span>Dashboard</span></a></li>
            <li><a href="browse-jobs.html"><i class="fas fa-search"></i> <span>Browse Jobs</span></a></li>
            <li><a href="my-applications.html" class="active"><i class="fas fa-paper-plane"></i> <span>My Applications</span></a></li>
            <li><a href="profile.html"><i class="fas fa-user"></i> My Profile</a></li>
            <li style="margin-top: 40px;"><a onclick="logout()" style="color:#f87171; cursor:pointer;"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></li>
        </ul>
    </nav>

    <main>
        <header>
            <h1>My Applications</h1>
            <p style="color: var(--text-muted);">Manage your submitted applications here.</p>
        </header>
        
        <div id="applicationsList" class="app-grid"></div>
    </main>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div class="modal-header">
                <h2>Application Details</h2>
            </div>
            <form id="editForm">
                <input type="hidden" id="editAppId">
                
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="editUserName" required>
                </div>
                <div class="form-group">
                    <label>Years of Experience</label>
                    <input type="text" id="editExperience">
                </div>
                <div class="form-group">
                    <label>Current Role</label>
                    <input type="text" id="editCurrentRole">
                </div>
                <div class="form-group">
                    <label>Education</label>
                    <input type="text" id="editEducation">
                </div>
                <div class="form-group">
                    <label>Skills</label>
                    <input type="text" id="editSkills">
                </div>
                <div class="form-group">
                    <label>Reason for Applying</label>
                    <textarea id="editReason" rows="3"></textarea>
                </div>
                
                <button type="submit" class="save-btn">Save Changes to Database</button>
            </form>
        </div>
    </div>

    <script>
        let myApps = [];

        async function fetchMyApplications() {
            const userId = localStorage.getItem("userId");
            const container = document.getElementById("applicationsList");

            try {
                // IMPORTANT: This relies on the updated Route 3 in applications.js (aggregation join)
                const response = await fetch(`http://localhost:5000/api/applications/my-applications/${userId}`);
                myApps = await response.json();
                
                container.innerHTML = myApps.map(app => `
                    <div class="app-card">
                        <div class="job-info">
                            <div class="job-title">${app.jobTitle || 'Course/Job Position'}</div>
                            <div style="font-size: 0.9rem; color: var(--text-muted);">
                                Status: <span class="status-badge status-pending">${app.status || 'Pending'}</span>
                            </div>
                        </div>
                        <div class="action-btns">
                            <button class="btn btn-info" onclick="openEditModal('${app._id}')">
                                <i class="fas fa-info-circle"></i> More Info / Edit
                            </button>
                            <button class="btn btn-delete" onclick="deleteApplication('${app._id}')">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                `).join("");

            } catch (err) {
                container.innerHTML = "Error loading applications.";
            }
        }

        function openEditModal(appId) {
            const app = myApps.find(a => a._id === appId);
            if (!app) return;

            document.getElementById('editAppId').value = app._id;
            document.getElementById('editUserName').value = app.userName || '';
            document.getElementById('editExperience').value = app.experience || '';
            document.getElementById('editCurrentRole').value = app.currentRole || '';
            document.getElementById('editEducation').value = app.education || '';
            document.getElementById('editSkills').value = app.skills || '';
            document.getElementById('editReason').value = app.reason || '';
            
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const appId = document.getElementById('editAppId').value;
            
            const updatedData = {
                userName: document.getElementById('editUserName').value,
                experience: document.getElementById('editExperience').value,
                currentRole: document.getElementById('editCurrentRole').value,
                education: document.getElementById('editEducation').value,
                skills: document.getElementById('editSkills').value,
                reason: document.getElementById('editReason').value
            };

            try {
                const res = await fetch(`http://localhost:5000/api/applications/update/${appId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedData)
                });

                if (res.ok) {
                    alert("Database updated successfully!");
                    closeModal();
                    fetchMyApplications(); 
                } else {
                    alert("Failed to update database.");
                }
            } catch (err) {
                console.error(err);
                alert("Server error during update.");
            }
        });

        async function deleteApplication(appId) {
            if (!confirm("Are you sure you want to delete this application?")) return;

            try {
                const res = await fetch(`http://localhost:5000/api/applications/delete/${appId}`, {
                    method: 'DELETE'
                });

                if (res.ok) {
                    alert("Deleted from database successfully.");
                    fetchMyApplications();
                } else {
                    alert("Failed to delete.");
                }
            } catch (err) {
                console.error(err);
                alert("Server error during deletion.");
            }
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        fetchMyApplications();
    </script>
</body>
</html>
