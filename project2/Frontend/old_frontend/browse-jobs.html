<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Jobs | CareerMatcher AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --sidebar: #0f172a;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --white: #ffffff;
            --border: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }

        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            display: flex; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar Navigation */
        nav { 
            width: 280px; 
            background: var(--sidebar); 
            color: white; 
            padding: 40px 24px; 
            position: fixed; 
            height: 100vh; 
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .logo { 
            font-size: 1.5rem; 
            font-weight: 800; 
            margin-bottom: 48px; 
            display: flex; 
            align-items: center; 
            gap: 12px;
            letter-spacing: -0.5px;
        }

        .logo i {
            color: var(--primary);
            filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.5));
        }

        .nav-links { list-style: none; flex-grow: 1; }

        .nav-links a { 
            color: #94a3b8; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            gap: 14px; 
            padding: 14px 18px; 
            border-radius: var(--radius-md); 
            transition: all 0.2s ease; 
            margin-bottom: 8px;
            font-weight: 500;
        }

        .nav-links a:hover { 
            color: white; 
            background: rgba(255, 255, 255, 0.05); 
        }

        .nav-links a.active { 
            background: var(--primary); 
            color: white; 
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .logout-link {
            color: #f87171 !important;
            margin-top: auto;
            border: 1px solid rgba(248, 113, 113, 0.2);
        }

        .logout-link:hover {
            background: rgba(248, 113, 113, 0.1) !important;
        }

        /* Main Content Area */
        main { 
            flex-grow: 1; 
            margin-left: 280px; 
            padding: 60px 80px; 
            max-width: 1400px;
        }

        header {
            margin-bottom: 48px;
        }

        header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Search Section */
        .search-container { 
            margin-bottom: 40px; 
            display: flex; 
            background: var(--white);
            padding: 8px;
            border-radius: 100px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            max-width: 600px;
            align-items: center;
            padding-left: 24px;
        }

        .search-container i {
            color: var(--text-muted);
        }

        .search-bar { 
            flex-grow: 1; 
            padding: 12px; 
            border: none; 
            outline: none; 
            font-size: 1rem;
            background: transparent;
            color: var(--text-main);
        }

        /* Job Card Grid */
        .job-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); 
            gap: 24px; 
        }

        .job-card { 
            background: var(--white); 
            padding: 32px; 
            border-radius: 24px; 
            border: 1px solid var(--border); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .job-card:hover { 
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            border-color: var(--primary);
        }

        .job-card h4 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--sidebar);
        }

        .job-card p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 24px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .apply-btn { 
            width: 100%; 
            padding: 14px; 
            background: #eef2ff; 
            color: var(--primary); 
            border: none; 
            border-radius: var(--radius-md); 
            cursor: pointer; 
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            margin-top: auto;
        }

        .job-card:hover .apply-btn {
            background: var(--primary);
            color: white;
        }

        /* Improved Modal Styling */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 2000; 
            left: 0; top: 0; 
            width: 100%; height: 100%; 
            background-color: rgba(15, 23, 42, 0.4); 
            backdrop-filter: blur(12px);
            align-items: center; 
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-content {
            background-color: var(--white);
            padding: 40px;
            border-radius: 28px;
            width: 95%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
        }

        .modal-content h2 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .form-group { margin-bottom: 20px; }

        .form-group label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 8px; 
            color: var(--text-main); 
            font-size: 0.85rem; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, .form-group textarea {
            width: 100%; 
            padding: 14px 18px; 
            border: 1px solid var(--border); 
            border-radius: var(--radius-md); 
            outline: none; 
            transition: 0.2s;
            background: #fcfdfe;
            font-size: 1rem;
        }

        .form-group input:focus, .form-group textarea:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            background: white;
        }

        .modal-buttons { display: flex; gap: 12px; margin-top: 32px; }

        .confirm-btn { 
            flex: 2; 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: var(--radius-md); 
            font-weight: 700; 
            cursor: pointer; 
            transition: background 0.2s;
        }

        .confirm-btn:hover { background: var(--primary-hover); }

        .cancel-btn { 
            flex: 1; 
            background: #f1f5f9; 
            color: var(--text-muted); 
            border: none; 
            padding: 16px; 
            border-radius: var(--radius-md); 
            cursor: pointer; 
            font-weight: 600;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* Responsive Design */
        @media (max-width: 1024px) {
            nav { width: 80px; padding: 30px 10px; }
            nav .logo span, nav .nav-links span { display: none; }
            main { margin-left: 80px; padding: 40px; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <i class="fas fa-bolt"></i> 
            <span>CareerMatcher</span>
        </div>
        <ul class="nav-links">
            <li><a href="user-dashboard.html"><i class="fas fa-th-large"></i> <span>Dashboard</span></a></li>
            <li><a href="browse-jobs.html" class="active"><i class="fas fa-search"></i> <span>Browse Jobs</span></a></li>
            <li><a href="my-applications.html"><i class="fas fa-paper-plane"></i> <span>Applied Jobs</span></a></li>
            <li><a href="profile.html"><i class="fas fa-user-circle"></i> <span>My Profile</span></a></li>
            <li style="margin-top: auto;">
                <a onclick="logout()" class="logout-link">
                    <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
                </a>
            </li>
        </ul>
    </nav>

    <main>
        <header>
            <h1>Find Your Next Role</h1>
            <p>Tailored opportunities curated by AI to match your skill set.</p>
        </header>
        
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="jobSearch" class="search-bar" placeholder="Search by job title, skills, or keywords..." onkeyup="filterJobs()">
        </div>

        <div id="allJobsList" class="job-grid">
            </div>
    </main>

    <div id="applyModal" class="modal">
        <div class="modal-content">
            <h2>Apply for Position</h2>
            <p style="color: #64748b; margin-bottom: 32px; font-size: 1rem;">Let the recruiter know why you're the perfect fit.</p>
            
            <form id="applicationForm">
                <input type="hidden" id="applyJobId">
                
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="applyName" placeholder="e.g. John Doe" required>
                </div>

                <div style="display: flex; gap: 20px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Experience (Years)</label>
                        <input type="number" id="applyExp" placeholder="e.g. 3" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Current Role</label>
                        <input type="text" id="applyCurrentRole" placeholder="e.g. UX Designer">
                    </div>
                </div>

                <div class="form-group">
                    <label>Education</label>
                    <input type="text" id="applyEdu" placeholder="e.g. Master's in Computer Science" required>
                </div>

                <div class="form-group">
                    <label>Key Skills</label>
                    <input type="text" id="applySkills" placeholder="e.g. React, Python, AWS" required>
                </div>

                <div class="form-group">
                    <label>Statement of Interest</label>
                    <textarea id="applyReason" rows="4" placeholder="Briefly describe your interest in this role..." required></textarea>
                </div>

                <div class="modal-buttons">
                    <button type="submit" class="confirm-btn">Submit Application</button>
                    <button type="button" class="cancel-btn" onclick="closeModal()">Maybe Later</button>
                </div>
            </form>
        </div>
    </div>

    <script src="browse-jobs.js"></script>
    <script>
        // Keeping your filter logic exactly as is
        function filterJobs() {
            let input = document.getElementById('jobSearch').value.toLowerCase();
            let cards = document.getElementsByClassName('job-card');
            for (let card of cards) {
                let title = card.querySelector('h4').innerText.toLowerCase();
                card.style.display = title.includes(input) ? "flex" : "none";
            }
        }

        function closeModal() {
            document.getElementById('applyModal').style.display = 'none';
        }

        function logout() { 
            localStorage.clear(); 
            window.location.href = 'index.html'; 
        }

        // Close modal when clicking outside content
        window.onclick = function(event) {
            let modal = document.getElementById('applyModal');
            if (event.target == modal) closeModal();
        }
    </script>
</body>
</html>
